name: BET PRO zilnic

on:
  schedule:
    # GitHub poate intarzia rularile programate; incercam de 3 ori dimineata,
    # emailul pleaca o singura data pe zi (data/email_sent.txt)
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "43 11,15 * * *"  # actualizari pentru aplicatie, fara email
  workflow_dispatch:
    inputs:
      email:
        description: "Trimite emailul? (da/nu)"
        default: "da"

permissions:
  contents: write

concurrency:
  group: betpro-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas
      - name: Analiza zilei
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.email }}" = "nu" ] || [ "${{ github.event.schedule }}" = "43 11,15 * * *" ]; then
            python run_daily.py --no-email
          else
            python run_daily.py
          fi
      - name: Salveaza jurnalul si raportul
        if: always()
        run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Ziua $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
