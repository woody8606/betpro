name: Test tenis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas openpyxl xlrd
      - run: python tenis/backtest.py
      - run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/tenis_backtest.* data/tenis || true
          git diff --cached --quiet || git commit -m "Test tenis"
          git pull --rebase --autostash || true
          git push
