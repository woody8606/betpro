name: Test cai Timeform

on:
  workflow_dispatch:
    inputs:
      zile:
        description: "Cate zile in urma"
        default: "365"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python cai/timeform.py ${{ github.event.inputs.zile }}
      - run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/cai_timeform.html data/cai || true
          git diff --cached --quiet || git commit -m "Test cai Timeform"
          git pull --rebase --autostash || true
          git push
