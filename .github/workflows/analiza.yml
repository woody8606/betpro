name: Analiza un meci

on:
  push:
    paths:
      - "cereri/analiza.txt"
  workflow_dispatch:
    inputs:
      gazde:
        description: "Gazde (ex. Romania)"
        required: true
      oaspeti:
        description: "Oaspeti (ex. Poland)"
        required: true
      data:
        description: "Data (AAAA-LL-ZZ)"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas
      - env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            mapfile -t A < cereri/analiza.txt
            python analiza_meci.py "${A[0]}" "${A[1]}" "${A[2]}"
          else
            python analiza_meci.py "${{ github.event.inputs.gazde }}" "${{ github.event.inputs.oaspeti }}" "${{ github.event.inputs.data }}"
          fi
      - run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/teams || true
          git diff --cached --quiet || git commit -m "Analiza meci"
          git pull --rebase --autostash || true
          git push
