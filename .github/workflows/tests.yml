name: Teste

on:
  push:
    paths: ["app.py", "betpro/**", "tests/**", "run_daily.py", "requirements.txt"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: API_FOOTBALL_KEY=test python tests/test_app.py
