name: Echipe de start

on:
  schedule:
    - cron: "*/20 9-21 * * *"
  push:
    paths:
      - "cereri/echipe.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: echipe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy pandas
      - env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -s cereri/echipe.txt ]; then
            python run_lineups.py $(cat cereri/echipe.txt)
          else
            python run_lineups.py
          fi
      - run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lineups reports || true
          git diff --cached --quiet || git commit -m "Echipe de start"
          git pull --rebase --autostash || true
          git push
