name: Lotto New York

on:
  schedule:
    - cron: "23 9 * * 4,0"   # joi si duminica dimineata, dupa extragerea de la New York
  workflow_dispatch:
    inputs:
      script:
        description: "scriptul de rulat"
        default: "lotto/nylotto.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python ${{ github.event.inputs.script || 'lotto/nylotto.py' }}
      - run: |
          git config user.name "BET PRO bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/lotto || true
          git diff --cached --quiet || git commit -m "Lotto New York"
          git pull --rebase --autostash || true
          git push
